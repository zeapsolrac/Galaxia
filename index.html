<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felices dos meses 💖</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #010103;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }
        #canvas-container { width: 100%; height: 100%; }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            box-sizing: border-box; padding: 2vh 2vw; z-index: 10;
        }
        .header-title { text-align: center; margin-top: 1vh; pointer-events: auto; }
        .header-title h1 {
            color: #ffb7c5; font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; margin: 0;
            text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 183, 197, 0.6);
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px rgba(255,183,197,0.5); transform: scale(1); }
            100% { text-shadow: 0 0 25px rgba(255,105,180,0.9); transform: scale(1.02); }
        }
        .galaxy-label {
            position: absolute; color: rgba(255, 255, 255, 0.85); font-size: clamp(10px, 1.2vw, 13px);
            padding: 4px 8px; border-radius: 4px; pointer-events: none; white-space: nowrap;
            transition: opacity 0.3s ease; text-shadow: 0 0 4px rgba(0,0,0,0.9);
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .galaxy-label.highlight {
            color: #ffe6f2; font-weight: 700; background: rgba(100, 20, 50, 0.5);
            border-color: rgba(255, 105, 180, 0.4);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui-layer"><div class="header-title"><h1>Felices dos meses 💖</h1></div></div>
    <div id="canvas-container"></div>
    <script>
        const phrases = [
            "Felices dos meses amor 💖", "Te amo mi vida 🥺", "Eres mi princesa 💫", "Mi consentida 🪐",
            "Mis ojitos lindos ✨", "Mi chaparrita hermosa 💖", "Eres mi mundo entero 🥺", "Te amo mi amor 💫",
            "Mi vida linda 🪐", "Eres mi princesa consentida ✨", "Te adoro mi chaparrita 💖", "Mi amor eterno 🥺",
            "Tus ojitos me iluminan 💫", "Eres mi vida 🪐", "Mi hermosa princesa ✨", "Mi amor 💖",
            "Mi vida, eres perfecta 🥺", "Te amo mi consentida 💫", "Mis ojitos lindos favoritos 🪐",
            "Mi chaparrita, te amo ✨", "Mi vida, mi todo 💖", "Eres mi amor verdadero 🥺",
            "Mi princesa, qué suerte tenerte 💫", "Te amo mi chaparrita 🪐", "Mis ojitos lindos ✨",
            "Mi consentida hermosa 💖", "Amor de mi vida 🥺", "Eres mi princesa 💫", "Te amo mi chaparrita 🪐",
            "Mi vida, mi cielo ✨", "Mi amor, eres única 💖", "Tus ojitos lindos me cautivan 🥺",
            "Mi consentida favorita 💫", "Eres mi vida 🪐", "Mi princesa hermosa ✨", "Amor 💖",
            "Te amo mi vida 🥺", "Eres mi chaparrita especial 💫", "Mis ojitos lindos 🪐",
            "Mi amor, te amo tanto ✨", "Eres mi consentida 💖", "Mi princesa hermosa 🥺",
            "Te amo mi chaparrita 💫", "Mi vida eres tú 🪐", "Tus ojitos me encantan ✨",
            "Mi amor, eres mi sol 💖", "Eres mi princesa consentida 🥺", "Te amo mi vida 💫",
            "Mi chaparrita, mi todo 🪐", "Mis ojitos lindos ✨", "Mi amor, mi alegría 💖",
            "Eres mi consentida 🥺", "Mi princesa hermosa 💫", "Te amo mi chaparrita 🪐",
            "Mi vida eres tú ✨", "Mis ojitos lindos 💖", "Mi amor, qué hermosa eres 🥺",
            "Eres mi consentida 💫", "Mi princesa, te amo 🪐", "Te amo mi chaparrita ✨",
            "Mi vida linda 💖", "Mis ojitos lindos 🥺", "Mi amor, eres todo 💫",
            "Eres mi consentida 🪐", "Mi princesa hermosa ✨", "Te amo mi chaparrita 💖",
            "Mi vida, te adoro 🥺", "Mis ojitos lindos 💫", "Mi amor, mi paz 🪐",
            "Eres mi consentida ✨", "Mi princesa, mi cielo 💖", "Te amo mi chaparrita 🥺",
            "Mi vida, qué bella 💫", "Mis ojitos lindos 🪐", "Mi amor, eres única ✨",
            "Eres mi consentida 💖", "Mi princesa hermosa 🥺", "Te amo mi chaparrita 💫",
            "Mi vida linda 🪐", "Mis ojitos lindos ✨", "Mi amor, mi fortuna 💖",
            "Eres mi consentida 🥺", "Mi princesa, mi luz 💫", "Te amo mi chaparrita 🪐",
            "Mi vida te ama ✨", "Mis ojitos lindos 💖", "Mi amor, eres magia 🥺",
            "Eres mi consentida 💫", "Mi princesa, te amo 🪐", "Te amo mi chaparrita ✨",
            "Mi vida linda 💖", "Mis ojitos lindos 🥺", "Mi amor, mi todo 💫",
            "Eres mi consentida 🪐", "Mi princesa hermosa ✨", "Te amo mi chaparrita 💖",
            "Mi vida, te adoro 🥺", "Mis ojitos lindos 💫", "Eres mi amor 🪐"
        ];

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 45, 60);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        
        const count = 120000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const colorInside = new THREE.Color('#ff69b4');
        const colorOutside = new THREE.Color('#1e90ff');

        for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            const radius = Math.random() * 90;
            const spinAngle = radius * 0.35;
            const branchAngle = ((i % 2) * Math.PI * 2) / 2;
            positions[i3] = Math.cos(branchAngle + spinAngle) * radius + (Math.random()-0.5)*20;
            positions[i3+1] = (Math.random()-0.5)*5;
            positions[i3+2] = Math.sin(branchAngle + spinAngle) * radius + (Math.random()-0.5)*20;
            const mixedColor = colorInside.clone().lerp(colorOutside, radius / 90);
            colors[i3] = mixedColor.r; colors[i3+1] = mixedColor.g; colors[i3+2] = mixedColor.b;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const material = new THREE.PointsMaterial({ size: 0.7, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
        const galaxy = new THREE.Points(geometry, material);
        scene.add(galaxy);

        const labels = [];
        const uiLayer = document.getElementById('ui-layer');
        phrases.forEach(p => {
            const div = document.createElement('div');
            div.className = 'galaxy-label';
            div.textContent = p;
            uiLayer.appendChild(div);
            const angle = Math.random() * Math.PI * 2;
            const radius = 10 + Math.random() * 60;
            labels.push({ element: div, position: new THREE.Vector3(Math.cos(angle)*radius, (Math.random()-0.5)*5, Math.sin(angle)*radius) });
        });

        function animate() {
            requestAnimationFrame(animate);
            galaxy.rotation.y += 0.0006;
            labels.forEach(l => {
                const pos = l.position.clone().applyMatrix4(galaxy.matrixWorld).project(camera);
                if (pos.z > 1) { l.element.style.display = 'none'; return; }
                l.element.style.display = 'block';
                l.element.style.transform = `translate(-50%, -50%) translate(${(pos.x*.5+.5)*window.innerWidth}px, ${(pos.y*-.5+.5)*window.innerHeight}px)`;
            });
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
