<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felices dos meses 💖</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #010103;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            box-sizing: border-box;
            padding: 3vh 2vw;
            z-index: 10;
        }
        .header-title {
            text-align: center;
            margin-top: 1vh;
            pointer-events: auto;
        }
        .header-title h1 {
            color: #ffb7c5;
            font-size: clamp(1.4rem, 3.5vw, 2.5rem);
            font-weight: 800;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
            text-shadow: 0 0 15px rgba(255, 183, 197, 0.6), 0 0 30px rgba(255, 105, 180, 0.4);
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px rgba(255,183,197,0.5); transform: scale(1); }
            100% { text-shadow: 0 0 25px rgba(255,105,180,0.9); transform: scale(1.02); }
        }
        .galaxy-label {
            position: absolute;
            color: rgba(255, 255, 255, 0.95);
            font-size: clamp(10px, 1.2vw, 13px);
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.3s ease;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.95), 0 0 10px rgba(255, 105, 180, 0.5);
            background: rgba(15, 10, 25, 0.65);
            border: 1px solid rgba(255, 105, 180, 0.3);
        }
    </style>
    <!-- Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="header-title">
            <h1>Felices dos meses 💖</h1>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const phrases = [
            "Felices dos meses amor 💖", "Te amo mi vida 🥺", "Mi princesa hermosa 💫", "Mi consentida 🪐",
            "Mis ojitos lindos ✨", "Mi chaparrita 💖", "Eres mi universo 🥺", "Te amo mi amor 💫",
            "Mi vida linda 🪐", "Princesa consentida ✨", "Te adoro chaparrita 💖", "Mi amor eterno 🥺",
            "Tus ojitos me iluminan 💫", "Eres mi todo 🪐", "Hermosa princesa ✨", "Mi amor 💖",
            "Eres perfecta 🥺", "Mi consentida 💫", "Ojitos lindos favoritos 🪐", "Chaparrita, te amo ✨",
            "Mi vida y mi todo 💖", "Amor verdadero 🥺", "Princesa de mi vida 💫", "Te amo chaparrita 🪐",
            "Mis ojitos lindos ✨", "Consentida hermosa 💖", "Amor de mi vida 🥺", "Mi princesa 💫",
            "Te amo tanto 🪐", "Mi cielo ✨", "Eres única 💖", "Amo tus besos 🥺",
            "Mi dulce refugio 💫", "Todo tiene sentido 🪐", "Pedacito de cielo ✨", "Mi mayor ilusión 💖",
            "Te amo infinitamente 🥺", "Amor bonito 💫", "Mi sol 🪐", "Alegría constante ✨",
            "Mi más grande orgullo 💖", "Te amo sin medidas 🥺", "Mi dulce paz 💫", "Destino favorito 🪐",
            "Tesoro preciado ✨", "Soy muy feliz 💖", "Mi gran fortuna 🥺", "Te amo con locura 💫",
            "Amor eterno 🪐", "Mi pensamiento lindo ✨", "Dulce compañía 💖", "Refugio seguro 🥺",
            "Te amo por siempre 💫", "Dulce inspiración 🪐", "Mi magia ✨", "Mi dulce latido 💖",
            "Gran verdad 🥺", "Te amo mi vida 💫", "Mi lucero 🪐", "Mi todo ✨",
            "Dulce encanto 💖", "Gran fortuna 🥺", "Te amo tanto 💫", "Dulce anhelo 🪐",
            "Mi dicha ✨", "Ilusión hermosa 💖", "Gran bendición 🥺", "Te amo con fervor 💫",
            "Dulce destino 🪐", "Mi regalo ✨", "Dulce alegría 💖", "Gran motor 🥺",
            "Te amo sin fin 💫", "Mi paz 🪐", "Gran refugio ✨", "Dulce amor 💖",
            "Mi universo 🥺", "Te amo mi princesa 💫", "Chaparrita hermosa 🪐", "Ojitos de mi vida ✨"
        ];

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010103, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 45, 65);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 300;
        controls.minDistance = 5;

        // 1. GALAXIA CON BRAZOS ESPIRALES MARCADOS PERO SUTILES
        const count = 100000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);

        const colorInside = new THREE.Color('#ff69b4');
        const colorOutside = new THREE.Color('#1e90ff');
        const colorCore = new THREE.Color('#ffffff');

        for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            const radius = Math.random() * 85;
            const spinAngle = radius * 0.5; // Curvatura de brazos espirales
            const branchAngle = ((i % 3) * Math.PI * 2) / 3; // 3 brazos espirales

            const randomX = (Math.random() - 0.5) * 12;
            const randomY = (Math.random() - 0.5) * 4;
            const randomZ = (Math.random() - 0.5) * 12;

            positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
            positions[i3 + 1] = randomY;
            positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

            const mixedColor = colorInside.clone();
            mixedColor.lerp(colorOutside, radius / 85);
            if (radius < 10) mixedColor.lerp(colorCore, 1 - radius / 10);

            colors[i3] = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const canvasCanvas = document.createElement('canvas');
        canvasCanvas.width = 16;
        canvasCanvas.height = 16;
        const ctx = canvasCanvas.getContext('2d');
        const gradient = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.5, 'rgba(255,180,220,0.5)');
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 16, 16);

        const particleTexture = new THREE.CanvasTexture(canvasCanvas);
        const material = new THREE.PointsMaterial({
            size: 0.8,
            sizeAttenuation: true,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false,
            map: particleTexture
        });

        const galaxy = new THREE.Points(geometry, material);
        scene.add(galaxy);

        // 2. FONDO DE ESTRELLAS (PUNTITOS RELLENANDO EL COSMOS)
        const starCount = 15000;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for(let s = 0; s < starCount * 3; s += 3) {
            starPos[s] = (Math.random() - 0.5) * 400;
            starPos[s+1] = (Math.random() - 0.5) * 400;
            starPos[s+2] = (Math.random() - 0.5) * 400;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ size: 0.6, color: 0xffffff, transparent: true, opacity: 0.7 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // 3. FRASES ESPARCIDAS POR TODA LA PANTALLA Y LA GALAXIA
        const labels = [];
        const uiLayer = document.getElementById('ui-layer');

        phrases.forEach(p => {
            const div = document.createElement('div');
            div.className = 'galaxy-label';
            div.textContent = p;
            uiLayer.appendChild(div);

            // Distribución amplia por todo el espacio tridimensional
            const angle = Math.random() * Math.PI * 2;
            const radius = 5 + Math.random() * 70;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = (Math.random() - 0.5) * 16;

            labels.push({ element: div, position: new THREE.Vector3(x, y, z) });
        });

        const tempV = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            galaxy.rotation.y += 0.0006;
            starField.rotation.y -= 0.0001;

            labels.forEach(l => {
                tempV.copy(l.position);
                tempV.applyMatrix4(galaxy.matrixWorld);

                const cloneV = tempV.clone();
                cloneV.project(camera);

                if (cloneV.z > 1 || cloneV.x < -1.1 || cloneV.x > 1.1 || cloneV.y < -1.1 || cloneV.y > 1.1) {
                    l.element.style.display = 'none';
                    return;
                }

                l.element.style.display = 'block';
                const x = (cloneV.x *  .5 + .5) * window.innerWidth;
                const y = (cloneV.y * -.5 + .5) * window.innerHeight;

                l.element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                
                // Desvanecer sutilmente las que estén muy lejos o detrás
                const dist = tempV.distanceTo(camera.position);
                const opacity = Math.max(0.15, Math.min(1, 1 - (dist / 140)));
                l.element.style.opacity = opacity;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
