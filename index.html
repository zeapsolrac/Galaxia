<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Galaxia ?? (Pantalla Completa)</title>
  <style>
    /* Estilos forzados para Pantalla Completa Total */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Evita barras de desplazamiento */
      background-color: #010103;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      color: #fff;
      touch-action: none;
    }

    /* Contenedor del Canvas 3D a pantalla completa */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Contenedor de las palabras a pantalla completa */
    #labels-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: none; /* Deja pasar los clics al 3D */
    }

    /* Estilo para las palabras súper legibles (borde negro) */
    .palabra-galactica {
      position: absolute;
      font-weight: 800;
      font-size: 13px;
      color: #ffffff;
      opacity: 1 !important;
      background: transparent;
      
      -webkit-text-stroke: 1.2px #000000; 
      text-stroke: 1.2px #000000;
      
      text-shadow: 
        1px 1px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;

      white-space: nowrap;
      will-change: transform;
      letter-spacing: 0.5px;
    }

    /* Título superior fijo */
    .ui-overlay {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      width: 90%;
      pointer-events: none;
    }

    h1 {
      font-size: 2rem;
      margin: 0;
      text-shadow: 0 0 12px #ff4d6d;
      letter-spacing: 2px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <!-- Contenedores para el 3D y los textos -->
  <div id="canvas-container"></div>
  <div id="labels-container"></div>

  <!-- Título fijo superior -->
  <div class="ui-overlay">
    <h1>NUESTRO UNIVERSO ??</h1>
  </div>

  <!-- Importamos la librería Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const container = document.getElementById('canvas-container');
    const labelsContainer = document.getElementById('labels-container');
    
    // --- CONFIGURACIÓN BÁSICA DE THREE.JS ---
    const scene = new THREE.Scene();
    
    // Cámara con ángulo de visión amplio
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    
    // AJUSTE CLAVE: Renderer y Canvas a Pantalla Completa
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Posición inicial agradable de la cámara
    let targetCameraDistance = 45; 
    let currentCameraDistance = 45;
    const minDistance = 15; // Límite para Zoom In
    const maxDistance = 80; // Límite para Zoom Out

    // Grupo contenedor para toda la galaxia
    const universeGroup = new THREE.Group();
    scene.add(universeGroup);

    // Colores base de la galaxia
    const cBlue = new THREE.Color(0x0a84ff);
    const cGold = new THREE.Color(0xffd60a);
    const cPurple = new THREE.Color(0xbf5af2);

    // --- 1. ESTRELLAS DE FONDO LEJANO (25,000 partículas para llenar el espacio) ---
    const starCount = 25000; 
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      const radius = 10 + Math.random() * 65;
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      
      starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta) * 0.6; // Un poco aplanado
      starPositions[i * 3 + 2] = radius * Math.cos(phi);

      // Mezcla de colores aleatorios para el fondo cósmico
      let rand = Math.random();
      let pickedColor = cBlue.clone();
      if (rand > 0.3 && rand < 0.7) pickedColor.lerp(cPurple, Math.random());
      else if (rand >= 0.7) pickedColor.lerp(cGold, Math.random());

      starColors[i * 3] = pickedColor.r;
      starColors[i * 3 + 1] = pickedColor.g;
      starColors[i * 3 + 2] = pickedColor.b;
    }

    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
    const starMaterial = new THREE.PointsMaterial({
      size: 0.08, 
      vertexColors: true,
      transparent: true,
      opacity: 0.65,
      blending: THREE.AdditiveBlending // Efecto de luz acumulativa
    });
    const starField = new THREE.Points(starGeometry, starMaterial);
    universeGroup.add(starField);

    // --- 2. LA GALAXIA ESPIRAL (25,000 partículas ultra densas) ---
    const galaxyCount = 25000;
    const galaxyGeometry = new THREE.BufferGeometry();
    const galaxyPositions = new Float32Array(galaxyCount * 3);
    const galaxyColors = new Float32Array(galaxyCount * 3);

    for (let i = 0; i < galaxyCount; i++) {
      const r = Math.pow(Math.random(), 1.3) * 26; // Radio de expansión
      const numBrazos = 4;
      const brazoActual = i % numBrazos; 
      const anguloBrazo = (brazoActual * 2 * Math.PI) / numBrazos;
      
      // Matemática para crear la espiral orgánica
      const dispersion = (Math.random() - 0.5) * (6.0 / (r + 1.0));
      const theta = anguloBrazo + (r * 0.35) + dispersion;
      
      galaxyPositions[i * 3] = r * Math.cos(theta);
      galaxyPositions[i * 3 + 1] = (Math.random() - 0.5) * 4.5 * Math.exp(-r * 0.07); 
      galaxyPositions[i * 3 + 2] = r * Math.sin(theta);

      // Degradado cromático: Núcleo dorado brillante -> Morado -> Azul cósmico
      const factor = r / 26;
      let mixColor = cGold.clone(); 
      if (factor > 0.05) mixColor.lerp(cPurple, (factor - 0.05) * 1.3);
      if (factor > 0.30) mixColor.lerp(cBlue, (factor - 0.30) * 1.4);

      galaxyColors[i * 3] = mixColor.r;
      galaxyColors[i * 3 + 1] = mixColor.g;
      galaxyColors[i * 3 + 2] = mixColor.b;
    }

    galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(galaxyPositions, 3));
    galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));
    
    const galaxyMaterial = new THREE.PointsMaterial({
      size: 0.20, // Partículas grandes para que brillen con fuerza
      vertexColors: true,
      transparent: true,
      opacity: 0.95, 
      blending: THREE.AdditiveBlending 
    });
    const galaxyMesh = new THREE.Points(galaxyGeometry, galaxyMaterial);
    universeGroup.add(galaxyMesh);

    // --- 3. BANCO DE FRASES Y DISTRIBUCIÓN ESPECÍFICA (115 elementos) ---
    // Listas para crear combinaciones románticas
    const inicios = ["Eres mi", "Siempre", "Juntos por", "Mi rincón", "Mi pequeña", "Amor", "Luz de mi", "Mi mundo", "Mi felicidad", "Dueña de mi", "Latido de mi", "Gracias por", "Te amo"];
    const conectores = ["universo", "princesa ??", "chaparrita ??", "infinito 8", "eterno", "2 meses juntos", "todo entero", "estrella ?", "reflejo", "destino ??", "magia ??", "vida", "cielo ??", "ilusión", "sonrisa ??", "corazón ??"];
    const finales = ["perfecto", "favorito", "en el cosmos", "por siempre", "cada día más", "sin final", "completo", "brillante ??", "alegría", "única", "hermosa", "mi suerte"];

    // Base de frases estáticas principales
    const frasesBase = [
      "TE AMO", "MI PRINCESA ??", "MI CHAPARRITA ??", "INFINITO 8", "2 MESES JUNTOS", 
      "ERES MI TODO", "NUESTRO UNIVERSO ??", "SIEMPRE JUNTOS", "MI MUNDO ??", "AMOR ETERNO",
      "SONRISAS ??", "RECUERDOS ??", "FELICIDAD", "SUEÑOS ?", "MI LUZ ??", "MAGIA ??",
      "DESTINO ??", "CARIÑO", "ILUSIÓN", "PASIÓN ??", "COMPLICES", "MI REFLEJO"
    ];

    // Generamos las frases únicas combinando las listas
    const bancoDeFrases = [...frasesBase];
    while (bancoDeFrases.length < 115) {
      const randomInicio = inicios[Math.floor(Math.random() * inicios.length)];
      const randomConector = conectores[Math.floor(Math.random() * conectores.length)];
      const randomFinal = finales[Math.floor(Math.random() * finales.length)];
      
      let fraseGenerada = Math.random() > 0.5 ? `${randomInicio} ${randomConector}` : `${randomConector} ${randomFinal}`;
      
      if (!bancoDeFrases.includes(fraseGenerada)) {
        bancoDeFrases.push(fraseGenerada);
      }
    }

    // Creamos los elementos HTML y asignamos su posición 3D dispersa
    const labelsData = [];
    const totalVisibles = 115; // Total exacto
    const frasesEnGalaxia = 15; // Las que quedan "dentro"
    const frasesEnEspacio = 100; // Las que llenan los bordes y vacíos

    for (let i = 0; i < totalVisibles; i++) {
      const el = document.createElement('div');
      el.className = 'palabra-galactica';
      el.textContent = bancoDeFrases[i % bancoDeFrases.length];
      labelsContainer.appendChild(el);

      let radius, theta, yPos;
      
      if (i < frasesEnGalaxia) {
        // 1. Las 15 dentro de la galaxia central
        radius = 5 + Math.random() * 19; 
        theta = (i * (Math.PI * 2 / frasesEnGalaxia)) + (Math.random() - 0.5) * 0.5;
        yPos = (Math.random() - 0.5) * 2.5; // Integradas al disco
      } else {
        // 2. Las 100 en los espacios negros y bordes exteriores
        radius = 27 + Math.random() * 28; 
        const indexDisperso = i - frasesEnGalaxia;
        // Distribución uniforme para que no se encimen
        theta = (indexDisperso * (Math.PI * 2 / frasesEnEspacio)) + (Math.random() - 0.5) * 0.4;
        
        // Estratificación de altura (Y) para rellenar los vacíos tridimensionales superiores e inferiores
        const totalRows = 10;
        const currentRow = Math.floor(indexDisperso / (frasesEnEspacio / totalRows));
        yPos = ((currentRow / totalRows) * 2 - 1) * 14 + (Math.random() - 0.5) * 2;
      }

      const pos3D = new THREE.Vector3(
        radius * Math.cos(theta),
        yPos,
        radius * Math.sin(theta)
      );

      labelsData.push({ element: el, pos3D: pos3D });
    }

    // --- 4. LÓGICA DE INTERACCIÓN (Swipe táctil y Mouse con Inercia) ---
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let rotationVelocityX = 0;
    let rotationVelocityY = 0;
    const friction = 0.96; // Factor de frenado para la inercia
    let startTouchDistance = 0;

    // Zoom interactivo con Rueda del Ratón
    window.addEventListener('wheel', (e) => {
      targetCameraDistance += e.deltaY * 0.03;
      // Limitar rango de zoom
      targetCameraDistance = Math.max(minDistance, Math.min(maxDistance, targetCameraDistance));
    }, { passive: true });

    // Manejo del inicio, movimiento y fin del toque/clic
    function onPointerDown(e) {
      if (e.touches && e.touches.length === 2) {
        // Pellizco para zoom (Dos dedos)
        isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        startTouchDistance = Math.sqrt(dx * dx + dy * dy);
      } else {
        // Rotación normal (Un dedo / mouse)
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        previousMousePosition = { x: clientX, y: clientY };
      }
    }

    function onPointerMove(e) {
      // Zoom táctil (Pinch-to-zoom)
      if (e.touches && e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const currentDistance = Math.sqrt(dx * dx + dy * dy);
        
        const deltaDistance = startTouchDistance - currentDistance;
        targetCameraDistance += deltaDistance * 0.08;
        targetCameraDistance = Math.max(minDistance, Math.min(maxDistance, targetCameraDistance));
        
        startTouchDistance = currentDistance;
        return; // No rotar mientras se hace zoom
      }

      // Rotación
      if (!isDragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const deltaX = clientX - previousMousePosition.x;
      const deltaY = clientY - previousMousePosition.y;

      // Calculamos velocidad de rotación según el movimiento
      rotationVelocityY = deltaX * 0.003;
      rotationVelocityX = deltaY * 0.0015;

      previousMousePosition = { x: clientX, y: clientY };
    }

    function onPointerUp() { isDragging = false; }

    // Event listeners para ratón y eventos táctiles
    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // --- 5. BUCLE DE ANIMACIÓN PRINCIPAL (Renderizado continuo) ---
    function animate() {
      requestAnimationFrame(animate);

      // Interpolación suave (Lerp) para que el zoom sea fluido
      currentCameraDistance += (targetCameraDistance - currentCameraDistance) * 0.08;
      
      // Actualizamos posición de cámara y ángulo según el zoom
      camera.position.set(0, currentCameraDistance * 0.70, currentCameraDistance * 1.0);
      camera.lookAt(0, -1, 0);

      // Aplicamos la rotación (arrastre o rotación automática)
      if (isDragging) {
        universeGroup.rotation.y += rotationVelocityY;
        universeGroup.rotation.x += rotationVelocityX;
      } else {
        universeGroup.rotation.y += 0.0006; // Rotación automática base
        // Aplicamos inercia
        universeGroup.rotation.y += rotationVelocityY;
        universeGroup.rotation.x += rotationVelocityX;
        // Frenado suave
        rotationVelocityY *= friction;
        rotationVelocityX *= friction;
      }

      // Limitamos inclinación vertical
      universeGroup.rotation.x = Math.max(-0.4, Math.min(0.4, universeGroup.rotation.x));

      // Obtenemos mitad de pantalla actual para posicionamiento de etiquetas
      const widthHalf = window.innerWidth / 2;
      const heightHalf = window.innerHeight / 2;

      // Actualizamos posición 2D de las palabras basándonos en su posición 3D
      labelsData.forEach(label => {
        // Clonamos posición y aplicamos rotación del grupo
        const wp = label.pos3D.clone().applyMatrix4(universeGroup.matrixWorld);
        // Proyectamos a coordenadas de pantalla (-1 a 1)
        const tempV = wp.clone().project(camera);
        
        // Si está fuera de la vista o detrás de la cámara, la ocultamos
        if (tempV.z > 1 || tempV.x < -1 || tempV.x > 1 || tempV.y < -1 || tempV.y > 1) {
          label.element.style.opacity = 0;
          return;
        }

        // Convertimos coordenadas proyectadas a píxeles
        const x = (tempV.x * widthHalf) + widthHalf;
        const y = (-(tempV.y * heightHalf) + heightHalf);

        // Efecto de profundidad: más opaco/grande al frente, tenue/pequeño al fondo
        const depthOpacity = (1.25 - tempV.z).toFixed(2);
        // Escala inteligente que responde tanto a la posición 3D como al Zoom
        const scaleFactor = ((1.15 - tempV.z * 0.45) * (45 / currentCameraDistance)).toFixed(2);

        // Aplicamos estilos finales ultra legibles
        label.element.style.opacity = Math.max(0.35, Math.min(depthOpacity, 1));
        label.element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px) scale(${scaleFactor})`;
      });

      // Renderizamos la escena 3D
      renderer.render(scene, camera);
    }

    // Iniciamos el bucle
    animate();

    // AJUSTE CLAVE: Lógica de redimensionado de ventana automática
    window.addEventListener('resize', () => {
      // Actualizamos cámara (aspect ratio) y renderer al nuevo tamaño
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
